name: Release

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: Python distribution name
        required: true
        type: string
      image_name:
        description: Container repository name
        required: true
        type: string
      version:
        description: Version (defaults to pyproject.toml)
        required: false
        type: string
      image_tag:
        description: Container tag (defaults to the package version)
        required: false
        type: string
      dry_run:
        description: Build only, publish nothing
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
          IMAGE_NAME: ${{ inputs.image_name }}
          VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os
          import re
          import sys

          package = os.environ["PACKAGE_NAME"]
          image = os.environ["IMAGE_NAME"]
          version = os.environ["VERSION"]

          if not re.fullmatch(r"[A-Za-z0-9](?:[A-Za-z0-9._-]*[A-Za-z0-9])?", package):
              sys.exit("invalid distribution name")
          if not re.fullmatch(r"[a-z0-9]+(?:[._-][a-z0-9]+)*", image):
              sys.exit("invalid repository name")
          if version and not re.fullmatch(r"[0-9]+(?:\.[0-9]+)+(?:(?:a|b|rc)[0-9]+)?(?:\.post[0-9]+)?", version):
              sys.exit("invalid version")
          PY

  build:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build tools
        run: python -m pip install --quiet build twine
      - name: Apply distribution metadata
        id: meta
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
          VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          path = pathlib.Path("pyproject.toml")
          original = path.read_text()
          project = tomllib.loads(original)["project"]
          version = os.environ["VERSION"] or project["version"]
          text = original.replace(f'name = "{project["name"]}"', f'name = "{os.environ["PACKAGE_NAME"]}"', 1)
          text = text.replace(f'version = "{project["version"]}"', f'version = "{version}"', 1)
          path.write_text(text)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
          PY
      - name: Build sdist
        run: python -m build --sdist
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
          manylinux: 2_28
          maturin-version: v1.15.0
          rust-toolchain: 1.98.0
      - name: Check
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-python:
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: python-index
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Upload
        env:
          INDEX_URL: ${{ vars.INDEX_URL }}
          INDEX_USERNAME: ${{ secrets.INDEX_USERNAME }}
          INDEX_PASSWORD: ${{ secrets.INDEX_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$INDEX_URL" || { echo "::error::INDEX_URL is required"; exit 1; }
          python -m pip install --quiet twine
          python -m twine upload --non-interactive --repository-url "$INDEX_URL" --username "$INDEX_USERNAME" --password "$INDEX_PASSWORD" dist/*

  publish-image:
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: container-registry
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Prepare image
        run: |
          set -euo pipefail
          wheel=$(ls dist/*.whl)
          entry=$(python - "$wheel" <<'PY'
          import sys
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as archive:
              metadata = next(name for name in archive.namelist() if name.endswith(".dist-info/entry_points.txt"))
              for line in archive.read(metadata).decode().splitlines():
                  line = line.strip()
                  if line and not line.startswith("[") and "=" in line:
                      print(line.split("=", 1)[0].strip())
                      break
          PY
          )
          cat > Dockerfile.release <<EOF
          FROM python:3.13-slim
          COPY dist/ /tmp/dist/
          RUN pip install --no-cache-dir "/tmp/dist/$(basename "$wheel")[proxy]"
          ENTRYPOINT ["$entry"]
          CMD ["--port", "4000"]
          EXPOSE 4000
          EOF
      - name: Create private repository
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_NAME: ${{ inputs.image_name }}
        run: |
          set -euo pipefail
          token=$(curl -fsS -X POST https://hub.docker.com/v2/users/login -H 'Content-Type: application/json' -d "{\"username\":\"$DOCKERHUB_USERNAME\",\"password\":\"$DOCKERHUB_TOKEN\"}" | jq -r .token)
          test -n "$token"
          test "$token" != "null"
          url="https://hub.docker.com/v2/repositories/$DOCKERHUB_USERNAME/$IMAGE_NAME"
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST https://hub.docker.com/v2/repositories/ -H "Authorization: JWT $token" -H 'Content-Type: application/json' -d "{\"namespace\":\"$DOCKERHUB_USERNAME\",\"name\":\"$IMAGE_NAME\",\"is_private\":true}")
          if [ "$status" != "201" ]; then
            curl -fsS -X PATCH "$url/" -H "Authorization: JWT $token" -H 'Content-Type: application/json' -d '{"is_private":true}' >/dev/null
          fi
          test "$(curl -fsS "$url/" -H "Authorization: JWT $token" | jq -r .is_private)" = "true"
      - name: Build and push
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          tag="${IMAGE_TAG:-$VERSION}"
          image="$DOCKERHUB_USERNAME/$IMAGE_NAME"
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          docker build -f Dockerfile.release -t "$image:$tag" .
          docker push "$image:$tag"